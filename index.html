<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 经期记录助手</title>
<style>
  :root {
    --primary: #e91e63;
    --primary-light: #fce4ec;
    --primary-dark: #c2185b;
    --bg: #fafafa;
    --card: #ffffff;
    --text: #333333;
    --text-secondary: #777777;
    --border: #eeeeee;
    --period: #ffcdd2;
    --period-text: #c62828;
    --prediction: #e1bee7;
    --prediction-text: #6a1b9a;
    --today: #e91e63;
    --danger: #f44336;
    --success: #4caf50;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
    min-height: 100vh;
    color: var(--text);
  }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px; }

  /* Header */
  .header {
    text-align: center;
    padding: 32px 0 24px;
  }
  .header h1 { font-size: 28px; font-weight: 700; color: var(--primary-dark); }
  .header .subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

  /* Stats Row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 16px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-card .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
  .stat-card .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .stat-card.warning .stat-value { color: var(--danger); }
  .stat-card.success .stat-value { color: var(--success); }

  /* Main Grid */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
  }
  @media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-card { padding: 14px 10px; }
    .stat-card .stat-value { font-size: 20px; }
  }

  /* Card */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Calendar */
  .calendar-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .calendar-nav button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 16px;
    color: var(--text);
    transition: all 0.2s;
  }
  .calendar-nav button:hover { background: var(--primary-light); border-color: var(--primary); }
  .calendar-nav .month-label { font-size: 18px; font-weight: 600; }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
  }
  .calendar-grid .day-header {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
    padding: 8px 0;
  }
  .calendar-grid .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .calendar-grid .day:hover { background: var(--primary-light); }
  .calendar-grid .day.other-month { color: #ccc; }
  .calendar-grid .day.other-month:hover { background: #f5f5f5; }
  .calendar-grid .day.today { border: 2px solid var(--today); font-weight: 700; }
  .calendar-grid .day.period-day {
    background: var(--period);
    color: var(--period-text);
    font-weight: 600;
  }
  .calendar-grid .day.period-day:hover { background: #ef9a9a; }
  .calendar-grid .day.predicted {
    background: var(--prediction);
    color: var(--prediction-text);
    border: 1px dashed #ce93d8;
  }
  .calendar-grid .day.period-day.predicted {
    background: var(--period);
    border-color: var(--period-text);
  }
  .calendar-grid .day.period-start {
    box-shadow: 0 0 0 3px rgba(233,30,99,0.3);
  }

  /* Sidebar */
  .sidebar { display: flex; flex-direction: column; gap: 20px; }

  /* Settings */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 14px; color: var(--text); }
  .cycle-input {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cycle-input input {
    width: 60px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
  }
  .cycle-input button {
    padding: 8px 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
  }
  .cycle-input button:hover { background: var(--primary-dark); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(233,30,99,0.3); }
  .btn-block { width: 100%; justify-content: center; }
  .btn-danger {
    background: white;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .btn-danger:hover { background: #ffebee; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  /* History List */
  .history-list { max-height: 360px; overflow-y: auto; }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    background: var(--primary-light);
    font-size: 14px;
  }
  .history-item .date { font-weight: 600; }
  .history-item .cycle-info { font-size: 12px; color: var(--text-secondary); }
  .history-item .delete-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .history-item .delete-btn:hover { color: var(--danger); background: #ffebee; }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend-dot.period { background: var(--period); }
  .legend-dot.predicted { background: var(--prediction); border: 1px dashed #ce93d8; }
  .legend-dot.today { width: 12px; height: 12px; border: 2px solid var(--today); border-radius: 50%; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .modal h3 { margin-bottom: 16px; font-size: 18px; }
  .modal .date-input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 2000;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
    pointer-events: none;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

  /* 注册密码弹窗 */
  .register-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 10000;
    align-items: center;
    justify-content: center;
  }
  .register-modal.active { display: flex; }
  .register-modal .register-dialog {
    background: white;
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .register-modal .register-dialog h3 {
    font-size: 18px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .register-modal .register-dialog .hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }
  .register-modal .register-dialog input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .register-modal .register-dialog .dialog-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* ====== 人脸识别锁屏 ====== */
  .lock-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 15, 25, 0.97);
    z-index: 9999;
    display: flex; align-items: center; justify-content: center;
  }
  .lock-overlay.hidden { display: none; }
  .lock-card {
    background: #1a1a2e; border-radius: 20px; padding: 32px 28px;
    max-width: 420px; width: 92%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    color: #e0e0e0;
  }
  .lock-card h2 { font-size: 22px; color: #fff; margin-bottom: 4px; }
  .lock-card .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
  .lock-camera-wrap {
    position: relative; border-radius: 14px; overflow: hidden;
    background: #000; margin-bottom: 16px; aspect-ratio: 4/3;
  }
  .lock-camera-wrap video, .lock-camera-wrap canvas {
    width: 100%; height: 100%; object-fit: cover;
  }
  .lock-camera-wrap .guide-text {
    position: absolute; bottom: 10px; left: 0; right: 0;
    text-align: center; font-size: 12px; color: rgba(255,255,255,0.6);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .lock-status {
    font-size: 13px; min-height: 20px; margin: 8px 0;
    transition: color 0.3s;
  }
  .lock-status.error { color: #f44336; }
  .lock-status.success { color: #4caf50; }
  .lock-status.loading { color: #ff9800; }
  .lock-btn {
    display: block; width: 100%; padding: 14px; border: none;
    border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    color: #fff; background: linear-gradient(135deg, #667eea, #764ba2);
    transition: all 0.3s; margin-top: 4px;
  }
  .lock-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
  .lock-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  /* Register modal inside lock */
  .register-form { display: none; }
  .register-form.active { display: block; }
  .register-form input {
    width: 100%; padding: 12px; border: 1px solid #333; border-radius: 10px;
    background: #12121f; color: #e0e0e0; font-size: 14px;
    text-align: center; margin-bottom: 12px;
  }
  .register-form .btn-row { display: flex; gap: 8px; }
  .register-form .btn-row button { flex: 1; }
  .btn-outline {
    padding: 10px; border: 1px solid #555; border-radius: 10px;
    background: transparent; color: #aaa; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-outline:hover { border-color: #888; color: #fff; }
  .btn-camera-retry {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(0,0,0,0.5); border: none; border-radius: 50%;
    width: 30px; height: 30px; color: #fff; cursor: pointer;
    font-size: 14px; display: none;
  }

</style>

<!-- 注册密码弹窗 -->

<div class="container" id="mainApp" style="display:none;">
  <div class="header">
    <h1>🌸 经期记录助手</h1>
    <p class="subtitle">记录周期 · 掌握规律 · 从容生活</p>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="main-grid">
    <div class="card" id="calendarCard">
      <div class="calendar-nav">
        <button onclick="prevMonth()">◀</button>
        <span class="month-label" id="monthLabel"></span>
        <button onclick="nextMonth()">▶</button>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="legend-dot period"></span> 经期</div>
        <div class="legend-item"><span class="legend-dot predicted"></span> 预测经期</div>
        <div class="legend-item"><span class="legend-dot today"></span> 今天</div>

    <div class="sidebar">
      <div class="card">
        <div class="card-title">📝 操作</div>
        <div style="margin-bottom: 12px;">
          <button class="btn btn-primary btn-block" onclick="recordToday()">
            🔴  记录今天为经期首日
          </button>
        </div>
        <button class="btn btn-primary btn-block" style="background:#ab47bc;" onclick="openDatePicker()">
          📅 选择日期记录
        </button>
      </div>

      <div class="card">
        <div class="card-title">⚙️ 设置</div>
        <div class="setting-row">
          <span class="setting-label">周期天数</span>
          <div class="cycle-input">
            <input type="number" id="cycleLengthInput" min="20" max="45" value="28">
            <button onclick="updateCycleLength()">保存</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">经期持续天数</span>
          <div class="cycle-input">
            <input type="number" id="periodDaysInput" min="2" max="10" value="7">
            <button onclick="updatePeriodDays()">保存</button>

      <div class="card">

        <div class="history-list" id="historyList">
          <div class="empty-state">暂无记录，点击上方按钮开始记录</div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
          <button class="btn btn-sm btn-danger" onclick="clearAll()">清空记录</button>
          <button class="btn btn-sm" style="background:#f5f5f5;border:1px solid #ddd;" onclick="exportData()">导出数据</button>

      </div>

  </div>
</div>

<div class="modal-overlay" id="modal">

    <input type="date" class="date-input" id="datePicker">
    <div class="modal-actions">
      <button class="btn btn-sm" style="background:#f5f5f5;border:1px solid #ddd;" onclick="closeModal()">取消</button>
      <button class="btn btn-sm btn-primary" onclick="confirmDate()">确认记录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" style="display:none;"></div>

<script>
// ==================== DATA LAYER ====================
const STORAGE_KEY = 'period-tracker-data';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { periods: ["2019-01-13", "2019-02-20", "2019-03-25", "2019-04-26", "2019-05-24", "2019-07-05", "2019-08-15", "2019-09-11", "2019-10-11", "2019-11-12", "2019-12-10", "2020-01-05", "2020-02-07", "2020-03-04", "2020-04-04", "2020-05-05", "2020-06-07", "2020-07-04", "2020-08-06", "2020-09-02", "2020-10-01", "2020-10-30", "2020-12-08", "2021-01-04", "2021-01-29", "2021-02-25", "2021-03-26", "2021-04-24", "2021-05-22", "2021-06-20", "2021-07-17", "2021-08-18", "2021-09-14", "2021-10-13", "2021-11-09", "2021-12-07", "2022-01-06", "2022-02-07", "2022-03-06", "2022-04-03", "2022-04-29", "2022-05-31", "2022-07-30", "2022-08-31", "2022-10-28", "2022-11-25", "2022-12-20", "2023-01-18", "2023-02-12", "2023-03-13", "2023-04-08", "2023-05-06", "2023-06-05", "2023-07-02", "2023-08-04", "2023-09-12", "2023-10-10", "2023-11-16", "2023-12-23", "2024-01-28", "2024-02-27", "2024-03-28", "2024-04-23", "2024-05-25", "2024-06-21", "2024-07-25", "2024-08-24", "2024-09-25", "2024-10-23", "2024-11-19", "2024-12-25", "2025-01-19", "2025-02-16", "2025-03-22", "2025-04-20", "2025-05-17", "2025-06-16", "2025-07-13", "2025-08-16", "2025-09-13", "2025-10-10", "2025-11-17", "2025-12-19", "2026-01-13", "2026-02-11", "2026-03-10", "2026-04-08", "2026-05-05", "2026-06-04", "2026-07-01", "2026-07-29"], cycleLength: 28, periodDays: 7 };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let appData = loadData();

// Periodic dates are stored as YYYY-MM-DD strings, sorted ascending
function sortedPeriods() {
  return [...appData.periods].sort((a, b) => a.localeCompare(b));
}

// ==================== TOAST ====================
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = 'toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2000);
}

// ==================== CALENDAR ====================
let calYear, calMonth;

function initCalendar() {
  const today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth(); // 0-based
  renderCalendar();
}

function prevMonth() {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function nextMonth() {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function renderCalendar() {
  const monthLabel = document.getElementById('monthLabel');
  monthLabel.textContent = `${calYear}年 ${calMonth + 1}月`;

  const grid = document.getElementById('calendarGrid');
  const headers = ['日', '一', '二', '三', '四', '五', '六'];

  const startDate = new Date(calYear, calMonth, 1);
  const startDay = startDate.getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

  const today = new Date();
  const todayStr = formatDate(today);

  const periods = sortedPeriods();
  const cycleLen = appData.cycleLength;
  const pdLen = appData.periodDays;

  // Build period date set for current month display
  const periodSet = new Set();
  const predictedSet = new Set();
  const predictedTypes = {}; // 'predicted' or 'period'

  // Mark actual period days
  for (const pStart of periods) {
    const start = new Date(pStart + 'T00:00:00');
    for (let i = 0; i < pdLen; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      const dStr = formatDate(d);
      if (d.getMonth() === calMonth && d.getFullYear() === calYear) {
        periodSet.add(dStr);
        predictedTypes[dStr] = 'period';
      }
    }
  }

  // Mark predicted days (next period)
  if (periods.length > 0) {
    const lastPeriod = periods[periods.length - 1];
    const nextStart = new Date(lastPeriod + 'T00:00:00');
    nextStart.setDate(nextStart.getDate() + cycleLen);
    // Show prediction for current month if it falls within
    for (let i = 0; i < pdLen; i++) {
      const d = new Date(nextStart);
      d.setDate(d.getDate() + i);
      const dStr = formatDate(d);
      if (d.getMonth() === calMonth && d.getFullYear() === calYear && !periodSet.has(dStr)) {
        predictedSet.add(dStr);
        predictedTypes[dStr] = 'predicted';
      }
    }
  }

  let html = headers.map(h => `<div class="day-header">${h}</div>`).join('');

  // Previous month tail
  for (let i = startDay - 1; i >= 0; i--) {
    const d = daysInPrevMonth - i;
    const dStr = formatDate(new Date(calYear, calMonth - 1, d));
    html += `<div class="day other-month">${d}</div>`;
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = formatDate(new Date(calYear, calMonth, d));
    const classes = ['day'];
    if (dStr === todayStr) classes.push('today');
    if (periodSet.has(dStr)) {
      classes.push('period-day');
      // Mark day 1 of each period as start
      const dayDate = new Date(calYear, calMonth, d);
      const isPeriodStart = periods.some(ps => {
        const start = new Date(ps + 'T00:00:00');
        return start.getTime() === dayDate.getTime();
      });
      if (isPeriodStart) classes.push('period-start');
    }
    if (predictedSet.has(dStr) && !periodSet.has(dStr)) classes.push('predicted');
    html += `<div class="${classes.join(' ')}" onclick="onDayClick('${dStr}')">${d}</div>`;
  }

  // Next month head
  const totalCells = startDay + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    html += `<div class="day other-month">${d}</div>`;
  }

  grid.innerHTML = html;
}

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function onDayClick(dateStr) {
  const periods = sortedPeriods();
  if (periods.includes(dateStr)) {
    if (confirm(`确定要删除 ${dateStr} 的经期记录吗？`)) {
      removePeriod(dateStr);
    }
  } else {
    if (confirm(`将 ${dateStr} 记录为经期首日？`)) {
      addPeriod(dateStr);
    }
  }
}

// ==================== PERIOD OPERATIONS ====================
function addPeriod(dateStr) {
  const periods = sortedPeriods();
  if (periods.includes(dateStr)) {
    showToast('该日期已记录');
    return;
  }
  // Don't allow duplicate dates too close (within 3 days)
  for (const p of periods) {
    const diff = Math.abs(new Date(dateStr) - new Date(p)) / (1000 * 60 * 60 * 24);
    if (diff < 3) {
      if (!confirm(`${dateStr} 与已有记录 ${p} 仅相隔 ${Math.round(diff)} 天，仍要记录吗？`)) {
        return;
      }
      break;
    }
  }
  appData.periods.push(dateStr);
  saveData(appData);
  refreshAll();
  showToast('✅ 已记录');
}

function removePeriod(dateStr) {
  appData.periods = appData.periods.filter(p => p !== dateStr);
  saveData(appData);
  refreshAll();
  showToast('已删除');
}

function recordToday() {
  const today = formatDate(new Date());
  addPeriod(today);
}

function openDatePicker() {
  document.getElementById('datePicker').value = formatDate(new Date());
  document.getElementById('datePicker').max = formatDate(new Date());
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function confirmDate() {
  const val = document.getElementById('datePicker').value;
  if (!val) { showToast('请选择日期'); return; }
  closeModal();
  addPeriod(val);
}

function updateCycleLength() {
  const val = parseInt(document.getElementById('cycleLengthInput').value);
  if (isNaN(val) || val < 20 || val > 45) {
    showToast('请输入 20-45 之间的天数');
    return;
  }
  appData.cycleLength = val;
  saveData(appData);
  refreshAll();
  showToast(`周期已设为 ${val} 天`);
}

function updatePeriodDays() {
  const val = parseInt(document.getElementById('periodDaysInput').value);
  if (isNaN(val) || val < 2 || val > 10) {
    showToast('请输入 2-10 之间的天数');
    return;
  }
  appData.periodDays = val;
  saveData(appData);
  refreshAll();
  showToast(`经期持续天数已设为 ${val} 天`);
}

function clearAll() {
  if (confirm('确定要清空所有经期记录吗？此操作不可撤销！')) {
    if (confirm('再次确认：删除所有数据？')) {
      appData.periods = [];
      saveData(appData);
      refreshAll();
      showToast('已清空全部记录');
    }
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `period-data-${formatDate(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}

// ==================== STATS ====================
function renderStats() {
  const periods = sortedPeriods();
  const lastPeriod = periods.length > 0 ? periods[periods.length - 1] : null;
  const cycleLen = appData.cycleLength;

  // Average cycle
  let avgCycle = null;
  if (periods.length >= 2) {
    let total = 0;
    for (let i = 1; i < periods.length; i++) {
      const diff = (new Date(periods[i]) - new Date(periods[i - 1])) / (1000 * 60 * 60 * 24);
      total += diff;
    }
    avgCycle = Math.round(total / (periods.length - 1));
  }

  // Next predicted
  let nextPredicted = null;
  if (lastPeriod) {
    const next = new Date(lastPeriod + 'T00:00:00');
    next.setDate(next.getDate() + cycleLen);
    nextPredicted = formatDate(next);
  }

  // Days until next
  let daysUntil = null;
  if (nextPredicted) {
    daysUntil = Math.round((new Date(nextPredicted + 'T00:00:00') - new Date(formatDate(new Date()) + 'T00:00:00')) / (1000 * 60 * 60 * 24));
  }

  const statsRow = document.getElementById('statsRow');
  let nextLabel = '预计还有';
  let nextClass = 'success';
  if (daysUntil !== null) {
    if (daysUntil < 0) {
      nextLabel = '已过期';
      nextClass = 'warning';
    } else if (daysUntil <= 3) {
      nextLabel = '即将来临';
      nextClass = 'warning';
    }
  }

  statsRow.innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${lastPeriod || '—'}</div>
      <div class="stat-label">最近一次经期</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${avgCycle !== null ? avgCycle + '天' : cycleLen + '天'}</div>
      <div class="stat-label">${avgCycle !== null ? '平均周期' : '设定周期'}</div>
    </div>
    <div class="stat-card ${nextClass}">
      <div class="stat-value">${nextPredicted || '—'}</div>
      <div class="stat-label">${nextLabel}${daysUntil !== null && daysUntil >= 0 ? ' · ' + daysUntil + '天' : ''}</div>
    </div>
  `;
}

// ==================== HISTORY ====================
function renderHistory() {
  const periods = sortedPeriods();
  const list = document.getElementById('historyList');
  if (periods.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无记录，点击上方按钮开始记录</div>';
    return;
  }
  let html = '';
  for (let i = periods.length - 1; i >= 0; i--) {
    const p = periods[i];
    let cycleInfo = '';
    if (i > 0) {
      const diff = Math.round((new Date(p) - new Date(periods[i - 1])) / (1000 * 60 * 60 * 24));
      cycleInfo = `← 距上次 ${diff} 天`;
    }
    html += `
      <div class="history-item">
        <div>
          <span class="date">${p}</span>
          ${cycleInfo ? `<span class="cycle-info"> ${cycleInfo}</span>` : ''}
        </div>
        <button class="delete-btn" onclick="event.stopPropagation(); removePeriod('${p}')" title="删除">✕</button>
      </div>
    `;
  }
  list.innerHTML = html;
}

function refreshAll() {
  renderCalendar();
  renderStats();
  renderHistory();
  document.getElementById('cycleLengthInput').value = appData.cycleLength;
  document.getElementById('periodDaysInput').value = appData.periodDays;
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ==================== FACE AUTH ====================
// API 地址：开发环境连 localhost，生产环境用 nginx 代理
// ==================== 人脸识别鉴权 (face-api.js) ====================
const FACE_STORAGE_KEY = 'face_registry';
const PIN_STORAGE_KEY = 'face_pin_hash';
const PRESET_PIN_HASH = "63470bd09c60478f8b24c7ba0b58401e266bed6d6f6ebaf20fe74f3bf05c8d1c";  // cxx071400.
const MODEL_URL = 'models';
let lockStream = null;
let lockVerified = false;
let cameraReady = false;
let faceModelReady = false;


// 初始化 face-api 模型
async function initFaceModels() {
  const subtitle = document.getElementById('lockSubtitle');
  const btn = document.getElementById('verifyBtn');
  
  // face-api.js 由本地 <script> 标签同步加载，这里确认就绪
  if (typeof faceapi === 'undefined') {
    subtitle.textContent = '⚠️ 库文件加载失败，请刷新';
    btn.textContent = '无效';
    return false;
  }
  
  try {
    subtitle.textContent = '⏳ 正在加载模型...';
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    faceModelReady = true;
    subtitle.textContent = '请正对摄像头，输入密码验证';
    updateVerifyBtn();
    return true;
  } catch (e) {
    subtitle.textContent = '⚠️ 模型加载失败: ' + e.message;
    btn.textContent = '🔄 重试';
    btn.disabled = false;
    btn.onclick = () => { location.reload(); };
    return false;
  }
}

function updateVerifyBtn() {
  const btn = document.getElementById('verifyBtn');
  const hasRegistered = !!localStorage.getItem(FACE_STORAGE_KEY);
  if (!faceModelReady) {
    btn.disabled = true; btn.textContent = '⏳ 加载模型中...';
  } else if (!cameraReady) {
    btn.disabled = true; btn.textContent = '⏳ 摄像头准备中...';
  } else if (!hasRegistered) {
    btn.textContent = '😊 注册人脸';
    btn.onclick = showRegisterForm;
    btn.disabled = false;
  } else {
    btn.textContent = '🔍 验证身份';
    btn.onclick = verifyFace;
    btn.disabled = false;
  }
}

// 初始化摄像头
async function initCamera() {
  const video = document.getElementById('lockCamera');
  const hint = document.getElementById('cameraHint');
  
  try {
    lockStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
      audio: false
    });
    video.srcObject = lockStream;
    video.onloadedmetadata = async () => {
      cameraReady = true;
      hint.textContent = '请正脸对准摄像头';
      updateVerifyBtn();
    };
  } catch (e) {
    hint.textContent = '❌ 需要摄像头权限';
    updateVerifyBtn();
  }
}

// 停止摄像头
function stopCamera() {
  if (lockStream) { lockStream.getTracks().forEach(t => t.stop()); lockStream = null; }
  cameraReady = false;
}

// 人脸验证
async function verifyFace() {
  if (!cameraReady || !faceModelReady || lockVerified) return;
  
  const video = document.getElementById('lockCamera');
  const status = document.getElementById('lockStatus');
  const btn = document.getElementById('verifyBtn');
  
  if (!localStorage.getItem(FACE_STORAGE_KEY)) {
    status.textContent = '⚠️ 请先注册人脸';
    status.className = 'lock-status error';
    btn.onclick = showRegisterForm;
    btn.disabled = false;
    return;
  }
  
  btn.disabled = true;
  btn.textContent = '⏳ 检测中...';
  status.textContent = '';
  status.className = 'lock-status loading';
  
  try {
    const detection = await faceapi.detectSingleFace(video,
      new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }));
    
    if (!detection) {
      status.textContent = '❌ 未检测到人脸，请正对摄像头';
      status.className = 'lock-status error';
      btn.disabled = false; btn.textContent = '🔄 重新验证';
      return;
    }
    
    // 弹窗验证 PIN
    const pin = prompt('🔐 请输入访问密码：');
    if (!pin) { status.textContent = ''; btn.disabled = false; btn.textContent = '🔍 开始验证'; return; }
    
    const inputHash = Array.from(
      new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin + 'face_lock_salt')))
    ).map(b => b.toString(16).padStart(2,'0')).join('');
    
    if (inputHash !== PRESET_PIN_HASH) {
      status.textContent = '❌ 密码错误';
      status.className = 'lock-status error';
      btn.disabled = false; btn.textContent = '🔄 重新验证';
      return;
    }
    
    lockVerified = true;
    status.textContent = '✅ 验证通过！';
    status.className = 'lock-status success';
    btn.textContent = '✅ 验证通过';
    sessionStorage.setItem('face_verified', 'true');
    sessionStorage.setItem('face_verified_at', Date.now().toString());
    setTimeout(() => {
      document.getElementById('lockScreen').classList.add('hidden');
      document.getElementById('mainApp').style.display = '';
      stopCamera();
      refreshAll();
    }, 600);
  } catch (e) {
    status.textContent = '⚠️ 检测出错: ' + e.message;
    status.className = 'lock-status error';
    btn.disabled = false; btn.textContent = '🔄 重试';
  }
}



// 注册表单
function showRegisterForm() {
  const regForm = document.getElementById('registerForm');
  regForm.classList.add('active');
  document.getElementById('regName').focus();
}

function hideRegisterForm() {
  document.getElementById('registerForm').classList.remove('active');
  document.getElementById('regStatus').textContent = '';
  document.getElementById('regPin').value = '';
}

// 人脸注册
// 人脸注册
async function registerFace() {
  const name = document.getElementById('regName').value.trim();
  const regStatus = document.getElementById('regStatus');
  
  if (!name) { regStatus.textContent = '请输入姓名'; regStatus.className = 'lock-status error'; return; }
  if (!cameraReady || !faceModelReady) { regStatus.textContent = '系统未就绪'; regStatus.className = 'lock-status error'; return; }
  
  // PIN 验证：弹出 prompt 输入密码
  const pinInput = prompt('请输入管理员密码以注册人脸：');
  if (!pinInput) { regStatus.textContent = ''; regStatus.className = ''; return; }
  const inputHash = Array.from(
    new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pinInput + 'face_lock_salt')))
  ).map(b => b.toString(16).padStart(2,'0')).join('');
  if (inputHash !== PRESET_PIN_HASH) {
    regStatus.textContent = '❌ 密码错误';
    regStatus.className = 'lock-status error';
    return;
  }
  
  regStatus.textContent = '⏳ 正在检测人脸...';
  regStatus.className = 'lock-status loading';
  
  try {
    const video = document.getElementById('lockCamera');
    const detection = await faceapi.detectSingleFace(video,
      new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }));
    
    if (!detection) {
      regStatus.textContent = '❌ 未检测到清晰人脸，请正对摄像头';
      regStatus.className = 'lock-status error';
      return;
    }
    
    localStorage.setItem(FACE_STORAGE_KEY, JSON.stringify({ name: name, registeredAt: Date.now() }));
    regStatus.textContent = `✅ 已成功注册 "${name}"`;
    regStatus.className = 'lock-status success';
    updateVerifyBtn();
    setTimeout(hideRegisterForm, 1500);
  } catch (e) {
    regStatus.textContent = '⚠️ 检测失败: ' + e.message;
    regStatus.className = 'lock-status error';
  }
}


// 检查 session
function checkFaceSession() {
  const verified = sessionStorage.getItem('face_verified');
  const verifiedAt = parseInt(sessionStorage.getItem('face_verified_at') || '0');
  const maxAge = 30 * 60 * 1000;
  
  if (verified === 'true' && (Date.now() - verifiedAt) < maxAge) {
    lockVerified = true;
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('mainApp').style.display = '';
    return true;
  }
  return false;
}

// 页面加载
async function initLock() {
  if (checkFaceSession()) { return; }
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('lockScreen').classList.remove('hidden');
  
  const modelOk = await initFaceModels();
  if (modelOk) await initCamera();
}

// 暴露全局引用确保 onclick 能调用
window.verifyFace = verifyFace;
window.registerFace = registerFace;
window.showRegisterForm = showRegisterForm;
window.hideRegisterForm = hideRegisterForm;
initLock();
window.addEventListener('beforeunload', stopCamera);

// ==================== INIT ====================
function initApp() {
  // initCalendar, renderStats, renderHistory are called after face unlock
  // or immediately if session is valid
  initCalendar();
  renderStats();
  renderHistory();
  document.getElementById('cycleLengthInput').value = appData.cycleLength;
  document.getElementById('periodDaysInput').value = appData.periodDays;
}
initApp();
</script>
