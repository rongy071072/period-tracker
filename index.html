<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>时序 · 周期记录</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: oklch(96.8% .009 120);
      --surface: oklch(99% .004 120);
      --surface-muted: oklch(94.7% .012 120);
      --ink: oklch(25% .035 142);
      --ink-soft: oklch(42% .026 142);
      --line: oklch(82% .017 120);
      --moss: oklch(33% .072 143);
      --moss-hover: oklch(27% .068 143);
      --moss-tint: oklch(91% .027 143);
      --terracotta: oklch(61% .105 43);
      --terracotta-tint: oklch(91% .04 43);
      --mist: oklch(67% .06 235);
      --mist-tint: oklch(93% .025 235);
      --danger: oklch(52% .17 25);
      --success: oklch(42% .105 145);
      --shadow: 0 5px 8px oklch(24% .03 140 / .07);
      --radius: 12px;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem;
      --space-5: 1.5rem; --space-6: 2rem; --space-7: 3rem;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--canvas); }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--canvas); color: var(--ink); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 1rem; line-height: 1.5; }
    button, input { font: inherit; }
    button { border: 0; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid oklch(61% .11 235); outline-offset: 3px; }
    .skip-link { position: fixed; z-index: 10; left: 1rem; top: -5rem; padding: .75rem 1rem; background: var(--moss); color: #fff; border-radius: 0 0 8px 8px; transition: top 180ms var(--ease); }
    .skip-link:focus { top: 0; }
    .app { width: min(100% - 2rem, 1320px); margin: 0 auto; padding: 1.25rem 0 3rem; }
    .topbar { display: flex; align-items: center; min-height: 62px; border-bottom: 1px solid var(--line); gap: var(--space-4); }
    .brand { color: var(--moss); text-decoration: none; font-family: Georgia, "Songti SC", serif; font-size: 2rem; font-weight: 700; letter-spacing: .08em; line-height: 1; }
    .top-actions { display: flex; align-items: center; gap: .75rem; margin-left: auto; }
    .context-switcher, .quiet-button, .month-button, .record-row { background: transparent; color: var(--ink); cursor: pointer; }
    .context-switcher { display: inline-flex; align-items: center; gap: .5rem; max-width: 330px; padding: .6rem .75rem; border-radius: 8px; color: var(--ink-soft); font-size: .9rem; text-align: left; }
    .context-switcher:hover { background: var(--moss-tint); color: var(--ink); }
    .person-dot { display: inline-grid; width: 28px; height: 28px; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--moss); color: #fff; font-size: .72rem; font-weight: 700; }
    .quiet-button { min-height: 42px; padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 8px; transition: background 180ms var(--ease), border-color 180ms var(--ease); }
    .quiet-button:hover { background: var(--surface-muted); border-color: var(--ink-soft); }
    .profile-initial { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 50%; background: var(--surface-muted); color: var(--moss); font-size: .8rem; font-weight: 700; text-decoration: none; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(296px, 360px); gap: clamp(1.5rem, 4vw, 4rem); padding-top: clamp(2rem, 5vw, 4.5rem); }
    .main-column { min-width: 0; }
    .heading-block { display: grid; gap: .35rem; margin-bottom: var(--space-6); }
    .heading-block h1 { margin: 0; max-width: 24ch; font-family: Georgia, "Songti SC", serif; font-size: 2.25rem; line-height: 1.15; letter-spacing: -.02em; text-wrap: balance; }
    .heading-block p { margin: 0; color: var(--ink-soft); }
    .calendar-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
    .calendar-head h2 { margin: 0; text-align: center; font-family: Georgia, "Songti SC", serif; font-size: 1.35rem; }
    .month-button { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid var(--line); border-radius: 8px; font-size: 1.45rem; line-height: 1; transition: background 180ms var(--ease), transform 180ms var(--ease); }
    .month-button:hover { background: var(--surface-muted); transform: translateY(-1px); }
    .calendar { margin-top: .65rem; }
    .weekdays, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays { color: var(--ink-soft); font-size: .8rem; font-weight: 650; text-align: center; }
    .weekdays span { padding: .55rem 0; }
    .days { border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .calendar-day { position: relative; min-height: 78px; padding: .55rem; overflow: hidden; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-align: left; transition: background 180ms var(--ease); }
    .calendar-day:hover { background: var(--surface-muted); }
    .calendar-day.is-other { color: oklch(67% .012 120); background: oklch(97% .006 120); }
    .calendar-day .date-number { position: relative; z-index: 1; display: inline-grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; font-size: .9rem; font-variant-numeric: tabular-nums; }
    .calendar-day.is-today .date-number { border: 2px solid var(--moss); font-weight: 750; }
    .calendar-day.is-period { background: var(--terracotta-tint); }
    .calendar-day.is-period::after { content: ""; position: absolute; inset: 9px; border-radius: 5px; background: var(--terracotta); opacity: .88; }
    .calendar-day.is-period .date-number { color: #fff; font-weight: 750; }
    .calendar-day.is-predicted { background: var(--mist-tint); }
    .calendar-day.is-predicted::after { content: ""; position: absolute; inset: 8px; border: 1.5px dashed var(--mist); border-radius: 5px; }
    .calendar-day.is-period.is-predicted::after { border-color: var(--terracotta); }
    .legend { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; margin-top: 1rem; color: var(--ink-soft); font-size: .86rem; }
    .legend-item { display: inline-flex; align-items: center; gap: .5rem; }
    .key { width: 13px; height: 13px; border-radius: 3px; }
    .key.actual { background: var(--terracotta); } .key.predicted { border: 1.5px dashed var(--mist); } .key.today { border: 2px solid var(--moss); border-radius: 50%; }
    .history { margin-top: clamp(2.25rem, 5vw, 4rem); }
    .section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .75rem; }
    .section-title h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 1.25rem; }
    .section-title button { color: var(--moss); background: none; cursor: pointer; font-size: .88rem; text-decoration: underline; text-underline-offset: .2em; }
    .record-list { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .record-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; width: 100%; min-height: 58px; padding: .8rem 1rem; border-bottom: 1px solid var(--line); text-align: left; }
    .record-row:last-child { border-bottom: 0; }
    .record-row:hover { background: var(--terracotta-tint); }
    .record-marker { width: 10px; height: 10px; margin-right: .85rem; border-radius: 50%; background: var(--terracotta); }
    .record-meta { color: var(--ink-soft); font-size: .86rem; }
    .arrow { color: var(--ink-soft); font-size: 1.25rem; }
    .side-column { display: grid; align-content: start; gap: 1.5rem; }
    .primary-button { min-height: 62px; padding: 1rem 1.25rem; background: var(--moss); color: #fff; border-radius: 9px; cursor: pointer; font-weight: 750; font-size: 1.05rem; letter-spacing: .01em; box-shadow: var(--shadow); transition: background 180ms var(--ease), transform 140ms var(--ease); }
    .primary-button:hover { background: var(--moss-hover); transform: translateY(-1px); }
    .primary-button:active { transform: translateY(1px) scale(.99); }
    .primary-button:disabled, .quiet-button:disabled { cursor: not-allowed; opacity: .55; }
    .panel { padding: 1.25rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .panel h2 { margin: 0 0 .8rem; font-family: Georgia, "Songti SC", serif; font-size: 1.1rem; }
    .period-date { margin: .35rem 0; color: var(--mist); font-size: 1.5rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .panel p { margin: .35rem 0; color: var(--ink-soft); font-size: .92rem; }
    .panel .fine-print { margin-top: 1rem; font-size: .8rem; line-height: 1.6; }
    .shared-head { display: flex; align-items: center; gap: .65rem; }
    .shared-head h2 { margin-bottom: 0; }
    .permission-tag { display: inline-flex; padding: .18rem .45rem; border-radius: 999px; background: var(--moss-tint); color: var(--moss); font-size: .75rem; font-weight: 700; }
    .panel-link { display: inline-flex; margin-top: .85rem; padding: 0; background: none; color: var(--moss); cursor: pointer; font-size: .88rem; text-decoration: underline; text-underline-offset: .2em; }
    .settings-list { margin: 0; padding: 0; list-style: none; }
    .settings-list button { display: grid; grid-template-columns: 1fr auto auto; width: 100%; padding: .8rem 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; text-align: left; }
    .settings-list li:last-child button { border-bottom: 0; padding-bottom: 0; }
    .settings-list span { color: var(--ink-soft); } .settings-list strong { margin-right: .6rem; font-size: .92rem; font-variant-numeric: tabular-nums; }
    .privacy { display: flex; gap: .65rem; color: var(--ink-soft); font-size: .8rem; line-height: 1.6; }
    .privacy b { color: var(--moss); }
    .loading { display: grid; gap: .75rem; }
    .skeleton { height: 1rem; border-radius: 4px; background: var(--surface-muted); animation: shimmer 1.5s infinite; }
    .skeleton.wide { width: 80%; height: 2rem; } .skeleton.short { width: 46%; }
    @keyframes shimmer { 50% { opacity: .45; } }
    .notice { margin: 1.5rem 0; padding: 1rem; border-radius: 8px; background: var(--terracotta-tint); color: oklch(32% .07 38); }
    .empty { padding: 1.5rem; color: var(--ink-soft); text-align: center; }
    dialog { width: min(100% - 2rem, 500px); max-height: min(760px, calc(100vh - 2rem)); padding: 0; border: 0; border-radius: 14px; color: var(--ink); background: var(--surface); box-shadow: 0 18px 55px oklch(22% .03 140 / .2); }
    dialog::backdrop { background: oklch(18% .02 140 / .36); }
    .dialog-body { padding: 1.5rem; }
    .dialog-title { display: flex; justify-content: space-between; align-items: start; gap: 1rem; margin-bottom: 1.5rem; }
    .dialog-title h2 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 1.35rem; }
    .close-button { display: grid; width: 40px; height: 40px; place-items: center; flex: 0 0 auto; background: var(--surface-muted); color: var(--ink); border-radius: 50%; cursor: pointer; font-size: 1.25rem; }
    .form-grid { display: grid; gap: 1rem; }
    label { display: grid; gap: .45rem; color: var(--ink-soft); font-size: .88rem; font-weight: 650; }
    input, select { width: 100%; min-height: 46px; padding: .65rem .75rem; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); }
    input:focus, select:focus { border-color: var(--moss); outline: 0; }
    .field-error { margin: -.35rem 0 0; color: var(--danger); font-size: .82rem; }
    .dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .65rem; margin-top: 1.5rem; }
    .danger-button { min-height: 42px; padding: .55rem .8rem; border: 1px solid var(--danger); border-radius: 8px; background: transparent; color: var(--danger); cursor: pointer; }
    .share-list { display: grid; gap: .5rem; margin-top: 1rem; }
    .share-row { display: grid; grid-template-columns: 1fr auto; gap: .75rem; align-items: center; padding: .8rem 0; border-bottom: 1px solid var(--line); }
    .share-row:last-child { border-bottom: 0; }
    .share-row strong, .share-row span { display: block; } .share-row span { color: var(--ink-soft); font-size: .84rem; }
    .toast { position: fixed; z-index: 5; bottom: max(1rem, env(safe-area-inset-bottom)); left: 50%; padding: .75rem 1rem; border-radius: 8px; background: var(--ink); color: #fff; box-shadow: var(--shadow); transform: translate(-50%, 120%); opacity: 0; transition: transform 220ms var(--ease), opacity 220ms var(--ease); }
    .toast.is-visible { transform: translate(-50%, 0); opacity: 1; }
    .auth-state { width: min(100% - 2rem, 600px); margin: 12vh auto; padding: 2rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: center; }
    .auth-state h1 { margin: 0 0 .5rem; font-family: Georgia, "Songti SC", serif; } .auth-state p { color: var(--ink-soft); }
    .auth-state .primary-button { margin-top: .75rem; }
    @media (max-width: 860px) { .workspace { grid-template-columns: 1fr; } .side-column { grid-template-columns: repeat(2, minmax(0, 1fr)); } .side-column > :first-child { grid-column: 1 / -1; } }
    @media (max-width: 620px) { .app { width: min(100% - 1rem, 1320px); padding-top: .5rem; } .topbar { min-height: 56px; } .brand { font-size: 1.55rem; } .context-switcher { max-width: 155px; padding: .45rem; } .context-switcher span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .quiet-button { width: 42px; padding: 0; overflow: hidden; white-space: nowrap; color: transparent; } .quiet-button::after { content: "管理"; color: var(--ink); font-size: .76rem; } .profile-initial { display: none; } .workspace { gap: 2rem; padding-top: 2rem; } .heading-block h1 { font-size: 1.85rem; } .calendar-day { min-height: 54px; padding: .3rem; } .calendar-day.is-period::after, .calendar-day.is-predicted::after { inset: 4px; } .calendar-day .date-number { width: 28px; height: 28px; font-size: .82rem; } .side-column { grid-template-columns: 1fr; gap: 1rem; } .side-column > :first-child { grid-column: auto; } .panel { padding: 1rem; } .record-row { padding: .7rem .8rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <main id="app" class="app" aria-live="polite"></main>
  <dialog id="record-dialog"></dialog><dialog id="settings-dialog"></dialog><dialog id="share-dialog"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const CONFIG = window.PERIOD_TRACKER_CONFIG || {};
    const API_BASE = (CONFIG.apiBaseUrl || '/api').replace(/\/$/, '');
    const HOME_URL = CONFIG.homeUrl || '/';
    const app = document.querySelector('#app');
    const dialogs = { record: document.querySelector('#record-dialog'), settings: document.querySelector('#settings-dialog'), share: document.querySelector('#share-dialog') };
    const state = { month: new Date(), calendar: null, shares: { createdByMe: [], sharedWithMe: [] }, shareId: '', hasChosenContext: false, loading: true, error: '' };

    function userInfo() { try { return JSON.parse(localStorage.getItem('userInfo') || 'null'); } catch { return null; } }
    function token() { return userInfo()?.token || ''; }
    function initials(value) { return (value || '我').trim().slice(0, 2).toUpperCase(); }
    function isoDate(date) { return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-'); }
    function monthParam(date) { return isoDate(date).slice(0, 7); }
    function formatDate(date) { return new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric' }).format(new Date(date + 'T00:00:00')); }
    function formatRange(start, end) { return end ? `${formatDate(start)} 至 ${formatDate(end)}` : formatDate(start); }
    function dayDiff(start, end) { return Math.round((new Date(end + 'T00:00:00') - new Date(start + 'T00:00:00')) / 86400000); }
    function escapeHtml(value = '') { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]); }
    function accountUrl() { const target = new URL(HOME_URL, window.location.href); target.searchParams.set('account', '1'); return target.toString(); }
    function query(shareId = state.shareId) { return shareId ? `?shareId=${encodeURIComponent(shareId)}` : ''; }
    function apiUrl(path, params) { const suffix = params ? `?${new URLSearchParams(params).toString()}` : ''; return `${API_BASE}${path}${suffix}`; }
    async function request(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, { ...options, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token()}`, ...(options.headers || {}) } });
      const payload = await response.json().catch(() => ({}));
      if (response.status === 401 || Number(payload.code) === 401) { localStorage.removeItem('userInfo'); throw new Error('登录已过期，请返回 Shinra-Hub 重新登录。'); }
      if (!response.ok || (payload.code !== undefined && Number(payload.code) !== 200)) throw new Error(payload.message || '请求未能完成，请稍后重试。');
      return payload.data ?? payload;
    }
    function renderAuthState() {
      app.innerHTML = `<section class="auth-state"><h1>需要统一账户登录</h1><p>时序会复用 Shinra-Hub 的登录状态，不单独保存账号或密码。</p><button class="primary-button" id="go-home">返回 Shinra-Hub 登录</button></section>`;
      document.querySelector('#go-home').onclick = () => location.assign(HOME_URL);
    }
    function activeShare() { return state.shares.sharedWithMe.find(item => item.id === state.shareId); }
    function profile() { return state.calendar?.profile || { cycleLength: 28, defaultPeriodDays: 7 }; }
    function actualPeriods() { return state.calendar?.actualPeriods || []; }
    function isInRange(day, start, end, days) { const endDate = end || isoDate(new Date(new Date(start + 'T00:00:00').getTime() + ((days || 7) - 1) * 86400000)); return day >= start && day <= endDate; }
    function render() {
      if (!token()) return renderAuthState();
      const me = userInfo() || {}; const share = activeShare(); const summary = state.calendar?.summary || {};
      const title = state.loading ? '正在整理周期信息' : summary.nextPredictedStartDate ? `下一次预计在 ${formatDate(summary.nextPredictedStartDate)}` : '从第一次记录开始';
      app.innerHTML = `
        <header class="topbar"><a class="brand" href="${escapeHtml(HOME_URL)}" aria-label="返回 Shinra-Hub">时序</a>
          <div class="top-actions"><button class="context-switcher" id="context-button" aria-label="切换查看的周期数据"><span class="person-dot">${initials(share?.ownerName || me.name || me.email)}</span><span>${share ? `正在编辑 ${escapeHtml(share.ownerName || share.ownerEmail)} 的周期` : '我的周期记录'}</span></button><a class="profile-initial" href="${escapeHtml(accountUrl())}" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开 Shinra-Hub 统一账户">${initials(me.name || me.email)}</a><button class="quiet-button" id="share-button">共同编辑管理</button></div>
        </header>
        <section id="main-content" class="workspace">
          <div class="main-column">
            <div class="heading-block"><h1>${title}</h1><p>${state.loading ? '正在加载真实记录…' : summary.lastPeriodStartDate ? `最近一次记录在 ${formatDate(summary.lastPeriodStartDate)}，当前按 ${summary.averageCycleDays || profile().cycleLength} 天周期计算。预测日期仅供日常参考。 ` : '记录一次经期首日后，这里会展示预测日期与周期历史。'}</p></div>
            ${state.error ? `<div class="notice">${escapeHtml(state.error)} <button class="panel-link" id="retry-button">重新加载</button></div>` : ''}
            ${state.loading ? '<div class="loading"><div class="skeleton wide"></div><div class="skeleton"></div><div class="skeleton short"></div></div>' : calendarHtml()}
          </div>
          <aside class="side-column">
            <button class="primary-button" id="record-today" ${state.loading ? 'disabled' : ''}>记录今天为首日</button>
            ${state.loading ? '<div class="panel loading"><div class="skeleton short"></div><div class="skeleton wide"></div></div>' : sideHtml(share)}
          </aside>
        </section>`;
      bindPageEvents();
    }
    function calendarHtml() {
      const current = state.month; const year = current.getFullYear(); const month = current.getMonth();
      const first = new Date(year, month, 1); const start = new Date(year, month, 1 - first.getDay()); const today = isoDate(new Date());
      let cells = '';
      for (let index = 0; index < 42; index++) { const date = new Date(start); date.setDate(start.getDate() + index); const day = isoDate(date); const actual = actualPeriods().find(item => isInRange(day, item.startDate, item.endDate, item.periodDays)); const predicted = (state.calendar?.predictedPeriods || []).find(item => isInRange(day, item.startDate, item.endDate, item.periodDays)); const classes = ['calendar-day']; if (date.getMonth() !== month) classes.push('is-other'); if (day === today) classes.push('is-today'); if (actual) classes.push('is-period'); if (predicted) classes.push('is-predicted'); cells += `<button class="${classes.join(' ')}" data-date="${day}" data-record-id="${actual?.id || ''}" aria-label="${day}${actual ? '，真实经期记录' : predicted ? '，预测经期' : '，记录经期首日'}"><span class="date-number">${date.getDate()}</span></button>`; }
      const history = state.calendar?.history || [];
      return `<section aria-labelledby="calendar-title"><div class="calendar-head"><button class="month-button" id="prev-month" aria-label="上一个月">‹</button><h2 id="calendar-title">${year} 年 ${month + 1} 月</h2><button class="month-button" id="next-month" aria-label="下一个月">›</button></div><div class="calendar"><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days">${cells}</div></div><div class="legend"><span class="legend-item"><i class="key actual"></i>真实经期</span><span class="legend-item"><i class="key predicted"></i>预测经期</span><span class="legend-item"><i class="key today"></i>今天</span></div></section>
        <section class="history" aria-labelledby="history-title"><div class="section-title"><h2 id="history-title">最近记录</h2></div><div class="record-list">${history.length ? history.map(item => `<button class="record-row" data-record-id="${item.id}"><i class="record-marker"></i><span>${formatDate(item.startDate)} · 持续 ${item.periodDays} 天 ${item.daysSincePrevious ? `<small class="record-meta">距上次 ${item.daysSincePrevious} 天</small>` : ''}</span><span class="arrow">›</span></button>`).join('') : '<div class="empty">还没有记录。点击“记录今天为首日”即可开始。</div>'}</div></section>`;
    }
    function sideHtml(share) {
      const summary = state.calendar?.summary || {}; const p = profile();
      return `<section class="panel"><h2>下次经期（预测）</h2><p class="period-date">${summary.nextPredictedStartDate ? formatRange(summary.nextPredictedStartDate, isoDate(new Date(new Date(summary.nextPredictedStartDate + 'T00:00:00').getTime() + (p.defaultPeriodDays - 1) * 86400000))) : '等待记录'}</p><p>${summary.daysUntilNextPeriod == null ? '记录首日后即可计算。' : summary.daysUntilNextPeriod >= 0 ? `预计还有 ${summary.daysUntilNextPeriod} 天` : `预计日期已过去 ${Math.abs(summary.daysUntilNextPeriod)} 天`}</p><p class="fine-print">预测基于历史记录与当前周期设置，不代表医疗建议。</p></section>
        <section class="panel"><div class="shared-head"><h2>${share ? '共同编辑中' : '共同编辑'}</h2><span class="permission-tag">${share ? '可查看和编辑' : '未共享'}</span></div><p>${share ? `你正在与 ${escapeHtml(share.ownerName || share.ownerEmail)} 共同维护这份周期记录。你们都可以查看和编辑。 ` : '你可以邀请已注册的伴侣共同查看和编辑周期记录。'}</p><button class="panel-link" id="manage-share-link">管理共同编辑</button></section>
        <section class="panel"><h2>周期设置</h2><ul class="settings-list"><li><button id="open-settings"><span>平均周期长度</span><strong>${p.cycleLength} 天</strong><b>›</b></button></li><li><button id="open-settings-duration"><span>经期持续天数</span><strong>${p.defaultPeriodDays} 天</strong><b>›</b></button></li><li><button id="open-settings-prediction"><span>预测方式</span><strong>${p.predictionMode === 'AVERAGE' ? '按历史平均' : '按设定周期'}</strong><b>›</b></button></li></ul></section>
        <p class="privacy"><b>◇</b><span>周期数据仅在你选择共同编辑后向指定用户开放。</span></p>`;
    }
    function bindPageEvents() {
      document.querySelector('#retry-button')?.addEventListener('click', load);
      document.querySelector('#record-today')?.addEventListener('click', () => openRecordDialog({ startDate: isoDate(new Date()) }));
      document.querySelector('#prev-month')?.addEventListener('click', () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); loadCalendar(); });
      document.querySelector('#next-month')?.addEventListener('click', () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); loadCalendar(); });
      document.querySelectorAll('[data-date]').forEach(button => button.addEventListener('click', () => button.dataset.recordId ? openRecordById(button.dataset.recordId) : openRecordDialog({ startDate: button.dataset.date })));
      document.querySelectorAll('[data-record-id]').forEach(button => { if (button.classList.contains('record-row')) button.addEventListener('click', () => openRecordById(button.dataset.recordId)); });
      document.querySelector('#open-settings')?.addEventListener('click', openSettingsDialog); document.querySelector('#open-settings-duration')?.addEventListener('click', openSettingsDialog); document.querySelector('#open-settings-prediction')?.addEventListener('click', openSettingsDialog);
      document.querySelector('#share-button')?.addEventListener('click', openShareDialog); document.querySelector('#manage-share-link')?.addEventListener('click', openShareDialog); document.querySelector('#context-button')?.addEventListener('click', openShareDialog);
    }
    function openDialog(dialog, content) { dialog.innerHTML = content; dialog.showModal(); dialog.querySelector('[data-close]')?.addEventListener('click', () => dialog.close()); }
    function openRecordDialog(record = {}) {
      const isEdit = Boolean(record.id); const maxDate = isoDate(new Date());
      openDialog(dialogs.record, `<form class="dialog-body" id="record-form"><div class="dialog-title"><h2>${isEdit ? '编辑经期记录' : '记录经期首日'}</h2><button type="button" class="close-button" data-close aria-label="关闭">×</button></div><div class="form-grid"><label>经期首日<input name="startDate" type="date" max="${maxDate}" value="${record.startDate || maxDate}" required></label><label>持续天数<input name="periodDays" type="number" min="2" max="10" value="${record.periodDays || profile().defaultPeriodDays}" required></label><label>备注（可选）<input name="remark" maxlength="500" value="${escapeHtml(record.remark || '')}"></label><p class="field-error" id="record-error" hidden></p></div><div class="dialog-actions">${isEdit ? '<button class="danger-button" type="button" id="delete-record">删除记录</button>' : ''}<button class="quiet-button" type="button" data-close>取消</button><button class="primary-button" type="submit">${isEdit ? '保存记录' : '添加记录'}</button></div></form>`);
      dialogs.record.querySelector('[data-close]')?.addEventListener('click', () => dialogs.record.close());
      dialogs.record.querySelector('#record-form').addEventListener('submit', async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.currentTarget)); data.periodDays = Number(data.periodDays); await submitRecord(record.id, data); });
      dialogs.record.querySelector('#delete-record')?.addEventListener('click', () => deleteRecord(record.id));
    }
    async function openRecordById(id) { try { const record = await request(`/v1/period/records/${encodeURIComponent(id)}${query()}`); openRecordDialog(record); } catch (error) { showToast(error.message); } }
    async function submitRecord(id, data) { const error = dialogs.record.querySelector('#record-error'); try { const path = id ? `/v1/period/records/${encodeURIComponent(id)}${query()}` : `/v1/period/records${query()}`; await request(path, { method: id ? 'PUT' : 'POST', body: JSON.stringify(data) }); dialogs.record.close(); showToast(id ? '记录已保存' : '已记录经期首日'); await load(); } catch (err) { error.textContent = err.message; error.hidden = false; } }
    async function deleteRecord(id) { if (!confirm('删除这条经期记录？此操作不可恢复。')) return; try { await request(`/v1/period/records/${encodeURIComponent(id)}${query()}`, { method: 'DELETE' }); dialogs.record.close(); showToast('记录已删除'); await load(); } catch (error) { showToast(error.message); } }
    function openSettingsDialog() { const p = profile(); openDialog(dialogs.settings, `<form class="dialog-body" id="settings-form"><div class="dialog-title"><h2>周期设置</h2><button type="button" class="close-button" data-close aria-label="关闭">×</button></div><div class="form-grid"><label>平均周期长度<input name="cycleLength" type="number" min="20" max="45" value="${p.cycleLength}" required></label><label>经期持续天数<input name="periodDays" type="number" min="2" max="10" value="${p.defaultPeriodDays}" required></label><label>预测方式<select name="predictionMode"><option value="MANUAL" ${p.predictionMode !== 'AVERAGE' ? 'selected' : ''}>按设定周期预测</option><option value="AVERAGE" ${p.predictionMode === 'AVERAGE' ? 'selected' : ''}>按历史平均预测</option></select></label><p class="field-error" id="settings-error" hidden></p></div><div class="dialog-actions"><button class="quiet-button" type="button" data-close>取消</button><button class="primary-button" type="submit">保存设置</button></div></form>`); dialogs.settings.querySelector('[data-close]')?.addEventListener('click', () => dialogs.settings.close()); dialogs.settings.querySelector('#settings-form').addEventListener('submit', async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.currentTarget)); data.cycleLength = Number(data.cycleLength); data.periodDays = Number(data.periodDays); try { await request(`/v1/period/profile${query()}`, { method: 'PUT', body: JSON.stringify(data) }); dialogs.settings.close(); showToast('周期设置已保存'); await load(); } catch (error) { const node = dialogs.settings.querySelector('#settings-error'); node.textContent = error.message; node.hidden = false; } }); }
    function openShareDialog() { const own = state.shares.createdByMe || []; const incoming = state.shares.sharedWithMe || []; openDialog(dialogs.share, `<div class="dialog-body"><div class="dialog-title"><h2>共同编辑管理</h2><button type="button" class="close-button" data-close aria-label="关闭">×</button></div><form class="form-grid" id="share-form"><label>伴侣的 Shinra-Hub 邮箱<input type="email" name="viewerEmail" placeholder="name@example.com" required></label><p>添加后，对方默认可查看和编辑你的周期记录。</p><p class="field-error" id="share-error" hidden></p><button class="primary-button" type="submit">添加共同编辑者</button></form><div class="share-list"><h3>我创建的共享</h3>${own.length ? own.map(item => `<div class="share-row"><div><strong>${escapeHtml(item.viewerName || item.viewerEmail)}</strong><span>${escapeHtml(item.viewerEmail || '')} · ${item.permission === 'EDIT' ? '可查看和编辑' : '仅查看'}</span></div><button class="danger-button" data-revoke="${item.id}">取消共享</button></div>`).join('') : '<p>尚未添加共同编辑者。</p>'}<h3>查看其他周期</h3><div class="share-row"><div><strong>我的周期记录</strong><span>查看和编辑自己的记录</span></div><button class="quiet-button" id="switch-own">查看</button></div>${incoming.length ? incoming.map(item => `<div class="share-row"><div><strong>${escapeHtml(item.ownerName || item.ownerEmail)}</strong><span>可查看和编辑</span></div><button class="quiet-button" data-switch-share="${item.id}">查看</button></div>`).join('') : '<p>暂未收到共享。</p>'}</div></div>`); dialogs.share.querySelector('[data-close]')?.addEventListener('click', () => dialogs.share.close()); dialogs.share.querySelector('#share-form').addEventListener('submit', createShare); dialogs.share.querySelectorAll('[data-revoke]').forEach(button => button.addEventListener('click', () => revokeShare(button.dataset.revoke))); dialogs.share.querySelector('#switch-own')?.addEventListener('click', () => { state.shareId = ''; state.hasChosenContext = true; dialogs.share.close(); load(); }); dialogs.share.querySelectorAll('[data-switch-share]').forEach(button => button.addEventListener('click', () => { state.shareId = button.dataset.switchShare; state.hasChosenContext = true; dialogs.share.close(); load(); })); }
    async function createShare(event) { event.preventDefault(); const error = dialogs.share.querySelector('#share-error'); try { await request('/v1/period/shares', { method: 'POST', body: JSON.stringify({ viewerEmail: new FormData(event.currentTarget).get('viewerEmail'), permission: 'EDIT' }) }); showToast('已添加共同编辑者'); await loadShares(); openShareDialog(); } catch (err) { error.textContent = err.message; error.hidden = false; } }
    async function revokeShare(id) { if (!confirm('取消这项共同编辑？对方将不能再访问你的周期记录。')) return; try { await request(`/v1/period/shares/${encodeURIComponent(id)}`, { method: 'DELETE' }); showToast('已取消共享'); await loadShares(); openShareDialog(); } catch (error) { showToast(error.message); } }
    async function loadShares() { state.shares = await request('/v1/period/shares'); }
    async function loadCalendar() { state.loading = true; state.error = ''; render(); try { state.calendar = await request(apiUrl('/v1/period/calendar', { month: monthParam(state.month), ...(state.shareId ? { shareId: state.shareId } : {}) }).replace(API_BASE, '')); } catch (error) { state.error = error.message; } finally { state.loading = false; render(); } }
    function selectInitialContext() { const incoming = state.shares.sharedWithMe || []; if (state.shareId && !incoming.some(item => item.id === state.shareId)) { state.shareId = ''; state.hasChosenContext = false; } if (!state.hasChosenContext && incoming.length) state.shareId = incoming[0].id; }
    async function load() { state.loading = true; state.error = ''; render(); try { await loadShares(); selectInitialContext(); state.calendar = await request(apiUrl('/v1/period/calendar', { month: monthParam(state.month), ...(state.shareId ? { shareId: state.shareId } : {}) }).replace(API_BASE, '')); } catch (error) { state.error = error.message; } finally { state.loading = false; render(); } }
    let toastTimer; function showToast(message) { const node = document.querySelector('#toast'); node.textContent = message; node.classList.add('is-visible'); clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove('is-visible'), 2600); }
    load();
  </script>
</body>
</html>
